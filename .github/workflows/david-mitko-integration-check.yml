name: DAVID Mitko integration static QA
on:
  push:
    branches:
      - integrate/mitko-pr9-pr10-preview-20261029
  pull_request:
    paths:
      - "src/*.mjs"
      - "tests/*.test.mjs"
      - "recovery/compiled-frontend/assets/*.js"
      - ".github/workflows/david-mitko-integration-check.yml"
permissions:
  contents: read
jobs:
  syntax-and-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check frontend and module syntax
        run: |
          node --check recovery/compiled-frontend/assets/index-p3-2.js
          node --check src/admin-worker-picker.mjs
          node --check src/operator-company-workflows.mjs
      - name: Install dependencies for API contract tests
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Execute unit/contract tests
        run: node --test tests/*.test.mjs
