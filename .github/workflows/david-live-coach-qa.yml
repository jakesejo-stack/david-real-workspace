name: DAVID live coach safe QA
on:
  push:
    branches:
      - feature/david-gemini-text-coach-20261030
    paths:
      - "api/integrations/david/**"
      - "src/server/**"
      - "src/david-call-intelligence-entry.mjs"
      - "tests/david-live-call-security.test.mjs"
      - ".github/workflows/david-live-coach-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-without-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check syntax
        run: |
          node --check 'api/integrations/david/[action].js'
          node --check src/server/david-live-calls.mjs
          node --check src/david-call-intelligence-entry.mjs
      - name: Run all unit and security tests
        run: node --test tests/*.test.mjs
