name: DAVID zero-cost isolated Postgres QA
on:
  push:
    branches: [qa/no-cost-postgres-isolation-20261030]
    paths:
      - "sql/016_david_operator_applications.sql"
      - "sql/017_david_company_activity.sql"
      - "sql/018_david_my_companies.sql"
      - "tests/sql/**"
      - ".github/workflows/david-free-postgres-qa.yml"
  pull_request:
    paths:
      - "sql/016_david_operator_applications.sql"
      - "sql/017_david_company_activity.sql"
      - "sql/018_david_my_companies.sql"
      - "tests/sql/**"
      - ".github/workflows/david-free-postgres-qa.yml"
permissions:
  contents: read
jobs:
  isolated-migration-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: david_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d david_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: david_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create disposable fixture schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/free-postgres-fixture.sql
      - name: Apply only the three proposed SQL migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 -f sql/016_david_operator_applications.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/017_david_company_activity.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/018_david_my_companies.sql
      - name: Check identity and operator isolation rules
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/free-postgres-check.sql
