name: DPP Center — safe 20-minute latest release check

on:
  schedule:
    - cron: '0,20,40 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpp-center-approved-production-deploy
  cancel-in-progress: false

jobs:
  checked_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout last approved main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Strict preservation gate — original source required
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          for f in package.json package-lock.json index.html vercel.json release/P0_SOURCE_RESTORED_APPROVED; do
            if [[ ! -f "$f" ]]; then
              echo "::notice::Not deploying: missing $f. Original Vite source must be recovered and reviewed."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          node -e "const p=require('./package.json'); if(!p.scripts?.build) process.exit(1)"
          AGE="$(( $(date +%s) - $(git log -1 --format=%ct) ))"
          if (( AGE > 1500 )); then
            echo "::notice::No recent main-branch changes; skip unnecessary paid build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and test restored source
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test --if-present
          npm run build

      - name: Trigger Borko's Vercel deployment hook ONLY after successful tests
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.DPP_VERIFIED_VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOOK}" ]]; then
            echo "::notice::No DPP_VERIFIED_VERCEL_DEPLOY_HOOK_URL configured; skip production."
            exit 0
          fi
          case "$DEPLOY_HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *) echo "::error::Unexpected deploy hook host/path; abort"; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 25 --retry 1 \
            -X POST "$DEPLOY_HOOK" >/dev/null
          echo "Vercel deployment triggered for tested main."
