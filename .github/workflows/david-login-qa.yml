name: DAVID verified-login unit tests
on:
  push:
    branches:
      - feat/first-dpp-worker-manual-pilot-20261028
  pull_request:
    paths:
      - 'src/david-verified-login.mjs'
      - 'tests/david-verified-login.test.mjs'
      - '.github/workflows/david-login-qa.yml'
permissions:
  contents: read
jobs:
  login-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run offline verified-login checks
        run: node --test tests/david-verified-login.test.mjs
